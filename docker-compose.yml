services:
  # ========================================================
  # Unit & Widget Test Runner
  # Run: docker compose run --rm test
  # ========================================================
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: listix:dev
    container_name: listix-test
    command: flutter test
    profiles:
      - test
      - ci

  # ========================================================
  # Static Analysis & Linter Runner
  # Run: docker compose run --rm analyze
  # ========================================================
  analyze:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: listix:dev
    container_name: listix-analyze
    command: flutter analyze
    profiles:
      - test
      - ci
