name: PR Checks

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title via Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  commit_lint:
    name: Lint Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Commitlint dependencies
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional

      - name: Validate PR Commit Messages
        run: |
          npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  pr_size:
    name: Check PR Size
    runs-on: ubuntu-latest
    steps:
      - name: Assess Pull Request Size
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });

            // Patterns to exclude from review size calculation
            const ignoredPatterns = [
              /pubspec\.lock$/,
              /\.metadata$/,
              /\.g\.dart$/,
              /\.freezed\.dart$/,
              /\.mocks\.dart$/,
              /^coverage\//,
              /\.(png|jpg|jpeg|gif|webp|svg|ico|ttf|woff|woff2)$/i,
              /\.idea\//,
              /\.vscode\//,
            ];

            let additions = 0;
            let deletions = 0;
            let countedFiles = 0;

            for (const file of files) {
              const isIgnored = ignoredPatterns.some(pattern => pattern.test(file.filename));
              if (!isIgnored) {
                additions += file.additions;
                deletions += file.deletions;
                countedFiles++;
              }
            }

            const totalChanges = additions + deletions;

            let sizeLabel = 'size/XS';
            if (totalChanges >= 1000) sizeLabel = 'size/XXL';
            else if (totalChanges >= 500) sizeLabel = 'size/XL';
            else if (totalChanges >= 300) sizeLabel = 'size/L';
            else if (totalChanges >= 150) sizeLabel = 'size/M';
            else if (totalChanges >= 50) sizeLabel = 'size/S';

            try {
              const currentLabels = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number
              });

              const sizeLabels = ['size/XS', 'size/S', 'size/M', 'size/L', 'size/XL', 'size/XXL'];
              for (const label of currentLabels.data) {
                if (sizeLabels.includes(label.name) && label.name !== sizeLabel) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.payload.pull_request.number,
                      name: label.name
                    });
                  } catch (e) {
                    // Ignore removal error if label not found
                  }
                }
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [sizeLabel]
              });
            } catch (err) {
              core.warning(`Label update failed (check repository permissions): ${err.message}`);
            }

            await core.summary
              .addHeading('📊 Pull Request Size Assessment')
              .addTable([
                [{data: 'Metric', header: true}, {data: 'Value', header: true}],
                ['Size Category', sizeLabel],
                ['Reviewed Files', countedFiles.toString()],
                ['Lines Added', `+${additions}`],
                ['Lines Removed', `-${deletions}`],
                ['Total Reviewed Lines', totalChanges.toString()]
              ])
              .write();

            if (totalChanges >= 500) {
              core.warning(`Large PR detected (${totalChanges} lines changed across ${countedFiles} files). Consider breaking this PR into smaller chunks (< 500 lines) for faster and more thorough reviews.`);
            }
